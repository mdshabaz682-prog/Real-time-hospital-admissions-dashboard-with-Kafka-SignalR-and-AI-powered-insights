name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build API
        run: dotnet build HospitalDashboard.Api/HospitalDashboard.Api.csproj -c Release
      - name: Build worker
        run: dotnet build HospitalDashboard.Worker/HospitalDashboard.Worker.csproj -c Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hospital-dashboard-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hospital-dashboard-ui/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration production

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f HospitalDashboard.Api/Dockerfile -t hospital-api .
      - name: Build worker image
        run: docker build -f HospitalDashboard.Worker/Dockerfile -t hospital-worker .
      - name: Build UI image
        run: docker build -t hospital-ui hospital-dashboard-ui
